upstream csn_app {
    server 192.168.122.159:8000 max_fails=1 fail_timeout=5s;
    server 192.168.122.163:8000 max_fails=1 fail_timeout=5s;
    server 192.168.122.189:8000 max_fails=1 fail_timeout=5s;
}

server {
    listen 80;

    location / {
        proxy_pass http://csn_app;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;
        add_header X-Upstream $upstream_addr always;
    }
}
